version: 2
updates:
  # Python dependencies - Main workshop
  - package-ecosystem: "pip"
    directory: "/"
    # Avoid overlap with lab4 config:
    exclude-paths:
      - "/04_Agents/**"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"

  # Python dependencies - Agents sparate requirements.txt
  - package-ecosystem: "pip"
    directory: "/04_Agents"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "chore(ci):"
